<svg xmlns="http://www.w3.org/2000/svg" width="1188" height="174" viewBox="0 0 1188 174" role="img" aria-labelledby="title description">
  <title id="title">Kairo Health results at a glance</title>
  <desc id="description">0.90 vs 0.77: Recall at heavy noise. LLM against regex; 55 of 56: Disagreements the LLM won. Heavy noise, McNemar p = 1.6e-15; 5 of 2,100: Values the LLM invented. None below severe noise; 25 of 30: Triage colors correct. Heavy noise, 2 RED under triaged</desc>
