<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Kairo Health</title>
  <desc id="description">Kairo Health. Turning photos of paper triage forms into structured data, and measuring where it breaks. Five form slips step from clean to extreme OCR noise.</desc>
  <defs>
    <filter id="b1" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="0.5"/></filter>
    <filter id="b2" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1"/></filter>
    <filter id="b3" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <filter id="b4" x="-10%" y="-30%" width="120%" height="160%"><feGaussianBlur stdDeviation="2.6"/></filter>
    <g id="slip">
      <rect width="300" height="40" rx="4"/>
      <rect x="14" y="11" width="34" height="5" rx="2" fill="#7d8595"/>
      <rect x="56" y="11" width="70" height="5" rx="2" fill="#10141b"/>
      <rect x="148" y="11" width="28" height="5" rx="2" fill="#7d8595"/>
      <rect x="184" y="11" width="46" height="5" rx="2" fill="#10141b"/>
      <rect x="250" y="9" width="9" height="9" rx="1" fill="none" stroke="#10141b" stroke-width="1.5"/>
      <rect x="14" y="25" width="34" height="5" rx="2" fill="#7d8595"/>
      <rect x="56" y="25" width="110" height="5" rx="2" fill="#10141b"/>
      <rect x="184" y="25" width="60" height="5" rx="2" fill="#10141b"/>
    </g>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="20" fill="#10141b" stroke="#2c3546"/>
  <rect x="64" y="72" width="6" height="176" rx="3" fill="#3b82f6"/>
  <text x="98" y="138" fill="#ffffff" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="62" font-weight="700">Kairo Health</text>
  <text x="100" y="186" fill="#e4edf9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23">Photos of paper triage forms, turned into data.</text>
  <text x="100" y="216" fill="#e4edf9" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="23">And a measure of where that breaks.</text>
  <text x="100" y="250" fill="#6ea2f7" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="12" letter-spacing="3">MSF TRIAGE FORM · FIVE OCR NOISE TIERS · REGEX AGAINST AN LLM</text>
  <g transform="translate(800 40)">
    <g fill="#ffffff"><use href="#slip"/></g>
    <g transform="translate(0 50) rotate(0.5 150 20)" filter="url(#b1)"><g fill="#fbfaf2"><use href="#slip"/></g></g>
    <g transform="translate(0 100) rotate(1.5 150 20)" filter="url(#b2)" opacity="0.92"><g fill="#f6f1d3"><use href="#slip"/></g></g>
    <g transform="translate(0 150) rotate(3 150 20)" filter="url(#b3)" opacity="0.8"><g fill="#efe7b8"><use href="#slip"/></g></g>
    <g transform="translate(0 200) rotate(5 150 20)" filter="url(#b4)" opacity="0.6"><g fill="#e8dd9e"><use href="#slip"/></g></g>
  </g>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="11" fill="#9aa3b5" text-anchor="end" letter-spacing="1">
    <text x="788" y="64">CLEAN</text>
    <text x="788" y="114">MODERATE</text>
    <text x="788" y="164">HEAVY</text>
    <text x="788" y="214">SEVERE</text>
    <text x="788" y="264">EXTREME</text>
  </g>
</svg>
